[build-system]
requires = ["maturin>=1.9.6,<2"]
build-backend = "maturin"

[project]
name = "printstash-mesh-native"
version = "0.1.0"
description = "Rust triangle rasterization for PrintStash previews"
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "printstash_mesh_native"
locked = true
