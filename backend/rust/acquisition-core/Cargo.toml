[package]
name = "printstash-acquisition-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }
