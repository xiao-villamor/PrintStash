[workspace]
members = [
    "acquisition-core",
    "archive-core",
    "gcode-core",
    "libbgcode-sys",
    "render-core",
    "similarity-core",
]
resolver = "2"

[package]
name = "printstash-mesh-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"

[lib]
name = "printstash_mesh_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
printstash-acquisition-core = { path = "acquisition-core" }
printstash-archive-core = { path = "archive-core" }
printstash-gcode-core = { path = "gcode-core" }
printstash-render-core = { path = "render-core" }
printstash-similarity-core = { path = "similarity-core" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
quick-xml = { version = "=0.42.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
petgraph = { version = "=0.8.3", default-features = false }
rayon = "=1.12.0"
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }

[profile.release]
lto = "thin"
codegen-units = 1
