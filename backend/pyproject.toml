[project]
name = "printstash"
version = "0.12.1"
description = "PrintStash — self-hosted 3D printing asset manager"
requires-python = ">=3.11"
dependencies = [
    "printstash-core[network,printers-all]",
    "cryptography>=50,<51",
    "alembic>=1.19,<2",
    "boto3>=1.43,<2",
    "botocore>=1.43,<2",
    "croniter>=6.2,<7",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<0.29",
    "lxml>=6.1,<7",
    "networkx>=3.6,<4",
    "numpy>=2,<3",
    "orjson>=3.11,<4",
    "pillow>=12.3,<13",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pwdlib[argon2,bcrypt]>=0.3,<1",
    "PyJWT>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "psycopg[binary]>=3.3,<4",
    "SQLAlchemy>=2.0.52,<2.1",
    "sqlmodel>=0.0.39,<0.1",
    "starlette>=1.6,<2",
    "trimesh>=5,<6",
    "uvicorn[standard]>=0.52,<1",
    "watchfiles>=1.2,<2",
    "pycentauri==0.9.1",
]

[project.optional-dependencies]
async-db = [
    "aiosqlite>=0.22,<1",
]
step = [
    # OpenCASCADE tessellation; 0.1.1 ships amd64 and arm64 Linux wheels.
    "cascadio>=0.1.1,<0.2",
]
full = [
    "cascadio>=0.1.1,<0.2",
    "opendal==0.47.6",
]
storage-opendal = [
    "opendal==0.47.6",
]
dev = [
    "bandit>=1.8",
    "deptry>=0.23,<1",
    "httpx2>=2.10,<3",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pytest-testmon>=2.2,<3",
    "pytest-xdist>=3.8,<4",
    "pytest-randomly>=3.15",
    "pyright>=1.1.403",
    "ruff>=0.8",
    "wsproto>=1.3,<2",
    "WsgiDAV>=4.3,<5",
    "cheroot>=11,<12",
    "asyncssh>=2.21,<3",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
addopts = "--capture=sys"
markers = [
    "e2e: end-to-end tests that boot the real app against contract-enforcing fakes (slower; run with `pytest tests/e2e`)",
    "integration: tests that cross a process/service/schema boundary or consume real-world fixture files",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is the standard pattern

[tool.deptry]
extend_exclude = ["tests"]
known_first_party = ["app"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Runtime plugins/drivers are imported by their owning frameworks rather than
# directly by application modules. Keep this allow-list narrow and auditable.
DEP002 = [
    "aiosqlite",
    "cascadio",
    "lxml",
    "networkx",
    "psycopg",
    "python-multipart",
    "uvicorn",
]

[tool.uv.sources]
printstash-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/printstash-core"]
