[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printstash-core"
version = "0.0.0"
description = "Framework-neutral contracts for PrintStash integrations"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
http = [
    "httpx>=0.27,<0.29",
    "websockets>=13,<18",
]
bambu = [
    "paho-mqtt>=2.1,<3",
]
elegoo = [
    "pycentauri>=0.6.5,<1",
]
printers-all = [
    "httpx>=0.27,<0.29",
    "websockets>=13,<18",
    "paho-mqtt>=2.1,<3",
    "pycentauri>=0.6.5,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.403",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/printstash_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Provider payloads and optional transport libraries expose intentionally
# untyped JSON/dynamic APIs. Keep strict checking for the core contracts while
# allowing those values to be validated at the protocol boundary.
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
