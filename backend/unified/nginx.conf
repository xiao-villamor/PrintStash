pid /tmp/printstash-nginx.pid;
error_log stderr;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Docker's inherited pipes may be root-owned after the entrypoint drops UID.
  # nginx's stderr target uses the inherited descriptor without reopening it.
  access_log off;
  client_body_temp_path /tmp/printstash-client-body;
  proxy_temp_path /tmp/printstash-proxy;
  fastcgi_temp_path /tmp/printstash-fastcgi;
  uwsgi_temp_path /tmp/printstash-uwsgi;
  scgi_temp_path /tmp/printstash-scgi;
  include /tmp/printstash-nginx-server.conf;
}
