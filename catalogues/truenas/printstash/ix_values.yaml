images:
  image:
    repository: ghcr.io/xiao-villamor/printstash
    # Release source: add the published 0.15.0 index digest before store submission.
    tag: "0.15.0"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  printstash_container_name: printstash
  perms_container_name: permissions
  notes_body: |
    Running behind a reverse proxy with TLS? Set `VAULT_SESSION_COOKIE_SECURE`
    and `FORWARDED_ALLOW_IPS` under Additional Environment Variables, and see
    https://printstash.org/docs/deployment
