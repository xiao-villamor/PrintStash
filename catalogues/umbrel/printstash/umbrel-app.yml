manifestVersion: 1
id: printstash
category: files
name: PrintStash
version: "0.15.0"
tagline: A self-hosted library for 3D models and the G-code that prints them
description: >-
  PrintStash keeps your 3D models, sliced G-code revisions and print history in
  one searchable library on your own server.


  - Preview STL, 3MF, OBJ, STEP and G-code in the browser, with collections,
  tags, search and duplicate detection.

  - Attach several slices to one model, compare slicer settings, and mark the
  revisions that printed well.

  - Index an existing folder in place instead of copying it.

  - Send prints and follow jobs on Klipper/Moonraker, with beta support for
  OctoPrint, PrusaLink, Bambu Lab (LAN) and Elegoo printers.


  Sign in with the username and password Umbrel shows for this app, then choose
  where PrintStash stores your files.
releaseNotes: >-
  Version 0.15.0 adds smoother paginated library browsing, editable Library
  sources, clearer import and preview progress, multi-material G-code fixes,
  and a unified image with optional GPU support. Back up, drain derivative
  work, and stop API and workers together before upgrading to DBOS 3.0.
  Source installs require Python 3.14 or newer; see UPGRADE.md.
developer: PrintStash contributors
website: https://www.printstash.org
dependencies: []
repo: https://github.com/xiao-villamor/PrintStash
support: https://github.com/xiao-villamor/PrintStash/issues
port: 3378
gallery: []
path: ""
# Umbrel generates a per-app password and shows both values on the app's page;
# docker-compose.yml passes them to VAULT_SETUP_ADMIN_*.
defaultUsername: "admin"
deterministicPassword: true
submitter: PrintStash contributors
submission: ""
