# PrintStash — advanced / reference deployment.
#
# Most people want docker-compose.yml instead: it is short and needs no
# configuration. This file wires every supported setting to a ${VARIABLE} with
# its default, so it doubles as documentation. Values come from a .env file
# next to it (see .env.example) or from the shell.
#
#   docker compose -f docker-compose.advanced.yml up -d
#
# Optional extras (all internal-only, never published to the host):
#   --profile postgres   PostgreSQL instead of SQLite (also set VAULT_DB_URL below)
#   --profile s3         SeaweedFS as a local S3-compatible store
#   --profile workers    Background-work containers beside the API; needs
#                        PostgreSQL, VAULT_PROCESS_ROLE=api and
#                        VAULT_SHARED_STORAGE=true (docs/deployment.md#background-work-and-workers)
#
# Behind a TLS reverse proxy: bind the web port to 127.0.0.1 (see frontend
# ports), set VAULT_SESSION_COOKIE_SECURE=true, a strong VAULT_JWT_SECRET, and
# FORWARDED_ALLOW_IPS to the proxy's address. See docs/deployment.md.
#
# Build from a checkout instead of pulling: uncomment the two `build:` blocks
# and run `docker compose -f docker-compose.advanced.yml up -d --build`.

x-logging: &default-logging
  # Rotate container logs so a long-running install cannot fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The API's volumes, shared by the workers: an upload the API stages is
# committed by whichever process runs its Job.
x-vault-volumes: &vault-volumes
  # Everything PrintStash keeps. A host folder works too:
  # /srv/printstash:/data (set PUID/PGID to its owner).
  - printstash:/data
  # An extra disk for a moved directory (see the api storage comments):
  # - /mnt/hdd/printstash:/mnt/hdd/printstash

services:
  frontend:
    image: ghcr.io/xiao-villamor/printstash-frontend:${PRINTSTASH_VERSION:-latest}
    # build:
    #   context: ./frontend
    container_name: printstash-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Behind a reverse proxy on the same host, use
      # "127.0.0.1:${PRINTSTASH_HTTP_PORT:-3000}:3000" so only the proxy can reach it.
      - "${PRINTSTASH_HTTP_PORT:-3000}:3000"
    # The SPA is served by nginx, which proxies /api/v1 (incl. WebSockets) to
    # the api service same-origin — so no browser-side API/WS URL is needed.
    environment:
      # nginx must allow request bodies up to the upload limit plus multipart
      # headroom, or large uploads fail with 413 before reaching the api.
      NGINX_CLIENT_MAX_BODY_SIZE: ${VAULT_MAX_REQUEST_MB:-528}m
    networks:
      - printstash_net
    depends_on:
      api:
        condition: service_healthy

  api:
    # Full image: browser capture + STEP tessellation. For a smaller image
    # without those, use ghcr.io/xiao-villamor/printstash-api-lite.
    image: ghcr.io/xiao-villamor/printstash-api:${PRINTSTASH_VERSION:-latest}
    # build:
    #   context: ./backend
    #   args:
    #     PRINTSTASH_VARIANT: full   # or: lite; optional local build: gpu
    container_name: printstash-api
    restart: unless-stopped
    logging: *default-logging
    # No host port: the frontend proxies /api/v1 to it inside the Docker network.
    expose:
      - "8000"
    # Anchored: the optional workers read exactly the same settings.
    environment: &api-environment
      # --- Storage ---
      VAULT_STORAGE_BACKEND: ${VAULT_STORAGE_BACKEND:-local}
      # Every app-owned path lives under the one volume mounted at /data (see
      # `volumes` below): files, thumbs, staging, backups, db, artifact-cache
      # and ai-models. The SQLite database defaults to /data/db/printstash.sqlite.
      #
      # Each directory can move on its own, e.g. files onto a large HDD while
      # the database stays on an SSD. Mount the other disk inside the
      # container and point one of these at it:
      #   VAULT_DATA_DIR: /mnt/hdd/printstash/files
      #   VAULT_THUMB_DIR: /mnt/ssd/printstash/thumbs
      #   VAULT_STAGING_DIR: /mnt/hdd/printstash/staging
      #   VAULT_BACKUP_DIR: /mnt/backups/printstash
      #   VAULT_ARTIFACT_CACHE_ROOT: /mnt/ssd/printstash/artifact-cache
      #   VAULT_EMBEDDING_CACHE_DIR: /mnt/ssd/printstash/ai-models
      # Keep VAULT_STAGING_DIR on the same mount as VAULT_DATA_DIR: imports
      # publish staged files into the library by hard link, which only works
      # within one mount. Split them, or map a second volume onto a subfolder
      # of /data (e.g. `- hdd:/data/files`), and every import copies its file;
      # Settings then warns. docs/deployment.md#hard-linked-imports
      #
      # PostgreSQL (with --profile postgres) instead of SQLite:
      #   VAULT_DB_URL: postgresql+psycopg://printstash:<POSTGRES_PASSWORD>@postgres:5432/printstash
      VAULT_SQLITE_SYNCHRONOUS: ${VAULT_SQLITE_SYNCHRONOUS:-NORMAL}
      # S3-compatible primary storage (VAULT_STORAGE_BACKEND=s3). With
      # --profile s3 the endpoint is http://seaweedfs:8333.
      VAULT_S3_BUCKET: ${VAULT_S3_BUCKET:-}
      VAULT_S3_ENDPOINT_URL: ${VAULT_S3_ENDPOINT_URL:-}
      VAULT_S3_REGION: ${VAULT_S3_REGION:-auto}
      VAULT_S3_ACCESS_KEY: ${VAULT_S3_ACCESS_KEY:-}
      VAULT_S3_SECRET_KEY: ${VAULT_S3_SECRET_KEY:-}
      VAULT_S3_PRESIGNED_URL_EXPIRE_SECONDS: ${VAULT_S3_PRESIGNED_URL_EXPIRE_SECONDS:-900}
      VAULT_S3_MULTIPART_THRESHOLD_MB: ${VAULT_S3_MULTIPART_THRESHOLD_MB:-50}

      # --- Backups ---
      VAULT_BACKUP_RETENTION_DAYS: ${VAULT_BACKUP_RETENTION_DAYS:-30}
      VAULT_BACKUP_S3_BUCKET: ${VAULT_BACKUP_S3_BUCKET:-}
      VAULT_BACKUP_S3_ENDPOINT_URL: ${VAULT_BACKUP_S3_ENDPOINT_URL:-}
      VAULT_BACKUP_S3_REGION: ${VAULT_BACKUP_S3_REGION:-auto}
      VAULT_BACKUP_S3_ACCESS_KEY: ${VAULT_BACKUP_S3_ACCESS_KEY:-}
      VAULT_BACKUP_S3_SECRET_KEY: ${VAULT_BACKUP_S3_SECRET_KEY:-}

      # --- Login and sessions ---
      # Optional. The placeholder below is public, so the API never signs with it:
      # on first boot it generates a real secret and persists it. Set this
      # explicitly (`openssl rand -hex 32`) to manage the value yourself — do so
      # for any internet-facing install. Do not set it to an empty string; that is
      # taken as a deliberate choice and skips the generated secret.
      VAULT_JWT_SECRET: ${VAULT_JWT_SECRET:-changeme_jwt_secret_please_change}
      # How the first administrator is created: trusted_network (browser
      # registration from private addresses), environment (from the
      # VAULT_SETUP_ADMIN_* variables below, at startup), or disabled. Use
      # `disabled` once setup is done, or when exposed.
      VAULT_SETUP_MODE: ${VAULT_SETUP_MODE:-trusted_network}
      VAULT_SETUP_ALLOWED_HOSTS: ${VAULT_SETUP_ALLOWED_HOSTS:-}
      # Only with VAULT_SETUP_MODE=environment; set in any other mode they are
      # a misconfiguration the setup page explains. Used once; blank is unset.
      VAULT_SETUP_ADMIN_USERNAME: ${VAULT_SETUP_ADMIN_USERNAME:-}
      VAULT_SETUP_ADMIN_PASSWORD: ${VAULT_SETUP_ADMIN_PASSWORD:-}
      VAULT_SETUP_ADMIN_EMAIL: ${VAULT_SETUP_ADMIN_EMAIL:-}
      VAULT_SECRETS_KEY: ${VAULT_SECRETS_KEY:-}
      # Set true when PrintStash is served over HTTPS.
      VAULT_SESSION_COOKIE_SECURE: ${VAULT_SESSION_COOKIE_SECURE:-false}
      VAULT_ACCESS_TOKEN_EXPIRE_MINUTES: ${VAULT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      VAULT_REMEMBER_ME_DAYS: ${VAULT_REMEMBER_ME_DAYS:-2}

      # --- OpenID Connect / SSO ---
      VAULT_OIDC_ENABLED: ${VAULT_OIDC_ENABLED:-false}
      VAULT_OIDC_ISSUER_URL: ${VAULT_OIDC_ISSUER_URL:-}
      VAULT_OIDC_CLIENT_ID: ${VAULT_OIDC_CLIENT_ID:-}
      VAULT_OIDC_CLIENT_SECRET: ${VAULT_OIDC_CLIENT_SECRET:-}
      VAULT_OIDC_SCOPES: ${VAULT_OIDC_SCOPES:-openid profile email groups}
      VAULT_OIDC_USERNAME_CLAIM: ${VAULT_OIDC_USERNAME_CLAIM:-preferred_username}
      VAULT_OIDC_GROUPS_CLAIM: ${VAULT_OIDC_GROUPS_CLAIM:-groups}
      VAULT_OIDC_ADMIN_GROUPS: ${VAULT_OIDC_ADMIN_GROUPS:-printstash-admins}
      VAULT_OIDC_DISPLAY_NAME: ${VAULT_OIDC_DISPLAY_NAME:-Single sign-on}
      VAULT_OIDC_REDIRECT_URI: ${VAULT_OIDC_REDIRECT_URI:-}
      VAULT_OIDC_ALLOW_INSECURE_HTTP: ${VAULT_OIDC_ALLOW_INSECURE_HTTP:-false}

      # --- Imports and capacity ---
      # Per-file cap. Raising it? Also raise VAULT_MAX_REQUEST_MB (frontend) to
      # at least this value + 16.
      VAULT_MAX_UPLOAD_MB: ${VAULT_MAX_UPLOAD_MB:-512}
      VAULT_PORTABLE_MANIFEST_MAX_MB: ${VAULT_PORTABLE_MANIFEST_MAX_MB:-128}
      VAULT_STAGING_MAX_PENDING: ${VAULT_STAGING_MAX_PENDING:-32}
      VAULT_STAGING_MAX_ACTIVE_PER_USER: ${VAULT_STAGING_MAX_ACTIVE_PER_USER:-4}
      VAULT_STAGING_MAX_GB: ${VAULT_STAGING_MAX_GB:-4}
      VAULT_STAGING_MIN_FREE_GB: ${VAULT_STAGING_MIN_FREE_GB:-1}
      VAULT_MEDIA_WORKER_TIMEOUT_SECONDS: ${VAULT_MEDIA_WORKER_TIMEOUT_SECONDS:-180}

      # --- Background work ---
      # `all` (default): this API runs HTTP and every background Job itself.
      # With --profile workers set `api`, PostgreSQL and VAULT_SHARED_STORAGE=true;
      # VAULT_API_RUNS_JOBS=false then leaves every Job to the workers.
      VAULT_PROCESS_ROLE: ${VAULT_PROCESS_ROLE:-all}
      VAULT_API_RUNS_JOBS: ${VAULT_API_RUNS_JOBS:-true}
      VAULT_SHARED_STORAGE: ${VAULT_SHARED_STORAGE:-false}
      # Per process: mesh renders at once (each can peak hundreds of MB), and
      # uploads committed at once. Settings → Background work overrides every
      # lane's concurrency at runtime for all processes.
      VAULT_MAX_RENDER_JOBS: ${VAULT_MAX_RENDER_JOBS:-1}
      # Derivative defaults; persisted Background work controls win on every process.
      VAULT_DERIVATIVES_MESH_ENABLED: ${VAULT_DERIVATIVES_MESH_ENABLED:-true}
      VAULT_DERIVATIVES_GCODE_ENABLED: ${VAULT_DERIVATIVES_GCODE_ENABLED:-true}
      VAULT_DERIVATIVES_TOOLPATH_ENABLED: ${VAULT_DERIVATIVES_TOOLPATH_ENABLED:-true}
      VAULT_JOBS_INGEST_CONCURRENCY: ${VAULT_JOBS_INGEST_CONCURRENCY:-2}

      # --- Runtime ---
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-INFO}
      VAULT_SLOW_REQUEST_MS: ${VAULT_SLOW_REQUEST_MS:-1000}
      # Settings can request a graceful API exit because this service has an
      # unless-stopped restart policy. Disable if you remove that supervisor.
      VAULT_RESTART_ENABLED: ${VAULT_RESTART_ENABLED:-true}
      # The API runs as this host identity so bind-mounted data remains
      # writable. Defaults match the image's unprivileged account.
      PUID: "${PUID:-10001}"
      PGID: "${PGID:-10001}"
      TZ: UTC
      # Trust X-Forwarded-For only from these peer IPs/CIDRs (uvicorn
      # --proxy-headers is already on). Leave unset unless the app is reachable
      # exclusively through a reverse proxy you control; then set it to that
      # proxy's address, or rate limiting and audit logs see only the proxy's IP.
      # See docs/known-limitations.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    volumes: *vault-volumes
    networks:
      - printstash_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No command override: the image entrypoint runs DB migrations on every
    # start, then launches the server. Overriding it can skip migrations (#29).

  worker:
    # Background work only: no HTTP, never migrates (it waits for the API's
    # schema). Same image, settings and volumes as the API.
    image: ghcr.io/xiao-villamor/printstash-api:${PRINTSTASH_VERSION:-latest}
    # build:
    #   context: ./backend
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - workers
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    environment:
      <<: *api-environment
      VAULT_PROCESS_ROLE: worker
    volumes: *vault-volumes
    networks:
      - printstash_net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: ${PRINTSTASH_WORKERS:-2}
    # SIGTERM ends the current step's bookkeeping; the engine reruns the rest.
    stop_grace_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: printstash-postgres
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printstash}
      POSTGRES_USER: ${POSTGRES_USER:-printstash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printstash}
    # Internal-only. Use `docker compose exec postgres psql ...` instead of
    # publishing the database to every host interface.
    volumes:
      - printstash_postgres:/var/lib/postgresql/data
    networks:
      - printstash_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printstash} -d ${POSTGRES_DB:-printstash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    container_name: ${SEAWEEDFS_CONTAINER_NAME:-printstash-seaweedfs}
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-printstash}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-printstash-secret}
    command: mini -dir=/data -master.telemetry=false
    # Internal-only. The API reaches S3 at http://seaweedfs:8333.
    volumes:
      - printstash_seaweedfs:/data
    networks:
      - printstash_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  printstash_net:
    driver: bridge

volumes:
  printstash:
  printstash_postgres:
  printstash_seaweedfs:
