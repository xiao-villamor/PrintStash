[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emoji-forge"
version = "0.1.0"
description = "Frame-by-frame emoji authoring and export tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pillow>=11"]

[project.optional-dependencies]
gpu = ["moderngl>=5.12", "glcontext>=3"]
webgl = ["playwright>=1.50"]
test = ["pytest>=8"]

[project.scripts]
forge = "scripts.forge:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.force-include]
shaders = "scripts/shaders"
