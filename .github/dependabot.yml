version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 0.0.45 stores every datetime as DateTime(timezone=True) and rejects
      # naive values; adopting it needs a TIMESTAMPTZ migration, not a bump.
      - dependency-name: sqlmodel
        versions:
          - ">=0.0.45"
