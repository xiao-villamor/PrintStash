name: Publish Container Images

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.image == 'printstash' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: printstash-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=full
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: printstash-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=full
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: printstash-api-lite
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=lite
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: printstash-api-lite
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=lite
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: printstash-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: ""
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: printstash-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: ""
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: printstash
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: printstash
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push platform image by digest
        if: matrix.image != 'printstash'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Normalize unified image name
        if: matrix.image == 'printstash'
        id: unified-name
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=${REGISTRY}/${OWNER,,}/printstash" >> "$GITHUB_OUTPUT"

      - name: Build and push unified image by digest
        if: matrix.image == 'printstash'
        id: unified-build
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: unified
          set: |
            *.platform=${{ matrix.platform }}
            unified.tags=
            unified.output=type=image,name=${{ steps.unified-name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
            unified.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            unified.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=gha,scope=printstash-${{ matrix.arch }}
            unified.cache-to=type=gha,scope=printstash-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Test unified image before promoting its digest
        if: matrix.image == 'printstash'
        id: unified
        env:
          IMAGE: ${{ steps.unified-name.outputs.image }}
          METADATA: ${{ steps.unified-build.outputs.metadata }}
        run: |
          digest=$(jq -er '.unified["containerimage.digest"]' <<< "$METADATA")
          docker pull "${IMAGE}@${digest}"
          bash backend/scripts/test-unified-image.sh "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.unified.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Grype scan ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: printstash-api
            arch: amd64
            runner: ubuntu-latest
          - image: printstash-api
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: printstash-api-lite
            arch: amd64
            runner: ubuntu-latest
          - image: printstash-api-lite
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: printstash-frontend
            arch: amd64
            runner: ubuntu-latest
          - image: printstash-frontend
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: printstash
            arch: amd64
            runner: ubuntu-latest
          - image: printstash
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.image }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable scan target
        id: target
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          shopt -s nullglob
          digest_files=("${RUNNER_TEMP}/digest/"*)
          if (( ${#digest_files[@]} != 1 )); then
            echo "::error::expected exactly one image digest, found ${#digest_files[@]}"
            exit 1
          fi
          digest=${digest_files[0]##*/}
          image="${REGISTRY}/${OWNER,,}/${{ matrix.image }}@sha256:${digest}"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Scan immutable image with Grype
        uses: ./.github/actions/grype-scan
        with:
          image: ${{ steps.target.outputs.image }}
          report-name: publish-${{ matrix.image }}-${{ matrix.arch }}

  merge:
    name: Publish ${{ matrix.image }}
    needs: [build, scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - printstash-api
          - printstash-api-lite
          - printstash-frontend
          - printstash
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}--*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and verify multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${IMAGE,,}"
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"

          digest_args=()
          for digest in *; do
            digest_args+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          docker buildx imagetools inspect "${tag_args[1]}"
