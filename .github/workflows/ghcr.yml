name: GHCR Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  # The push trigger's tag glob (v*.*.*) also matches non-semver strings like
  # "vfoo.bar.baz" — this is the strict check. Applies to workflow_dispatch
  # too, so a manual run against a branch ref can't slip past it either.
  guard:
    name: Validate release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref '$TAG' is not a strict semver tag (vX.Y.Z)"
            exit 1
          fi
          python3 scripts/verify-release-version.py "$TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::release tag is not on main"
            exit 1
          }
      - name: Require successful CI and Deep CI for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          python3 scripts/verify-ci-run.py ci.yml "$sha"
          python3 scripts/verify-ci-run.py deep-ci.yml "$sha"

  publish:
    needs: guard
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/container-publish.yml
    secrets: inherit
