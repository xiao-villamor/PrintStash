name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_NUM_THREADS: "1"

# Only superseded PR runs are disposable. A release can refer to any completed
# main SHA, so a later push must never cancel that SHA's required result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend quick (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            paths: tests/unit
          - suite: contract
            paths: tests/contract
          - suite: e2e
            paths: tests/e2e
          - suite: integration-api-routes
            paths: tests/integration/api/test_*.py tests/integration/api/v1/test_*.py
          - suite: integration-api-domains
            paths: tests/integration/api/v1/files tests/integration/api/v1/inbox tests/integration/api/v1/ingest tests/integration/api/v1/models tests/integration/api/v1/printers tests/integration/api/v1/provider_connections tests/integration/api/v1/storage tests/integration/api/v1/taxonomy
          - suite: integration-platform
            paths: tests/integration/bootstrap tests/integration/core tests/integration/db tests/integration/main tests/integration/postgres tests/integration/runtime
          - suite: integration-domains-a
            paths: tests/integration/modules/administration tests/integration/modules/backups tests/integration/modules/derivatives tests/integration/modules/identity tests/integration/modules/inference tests/integration/modules/ingestion tests/integration/modules/library tests/integration/modules/media
          - suite: integration-domains-b
            paths: tests/integration/modules/notifications tests/integration/modules/printing tests/integration/modules/search tests/integration/modules/similarity tests/integration/modules/sources tests/integration/modules/storage tests/integration/modules/work
          - suite: repository
            paths: tests/repo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --extra full --frozen
      - name: Verify optional dependency boundary
        if: matrix.suite == 'unit'
        run: |
          if uv export --no-dev --frozen | grep -q aiosqlite; then
            echo "aiosqlite leaked into the core dependency set"
            exit 1
          fi
          if grep -Eq '^name = "(asyncpg|psycopg2-binary)"' uv.lock; then
            echo "a retired PostgreSQL driver remains in uv.lock"
            exit 1
          fi
      - if: matrix.suite == 'unit'
        run: uv run ruff check app/ tests/
      - if: matrix.suite == 'unit'
        run: uv run ruff format --check app/core app/db app/schemas packages/printstash-core/src
      - if: matrix.suite == 'unit'
        run: uv run deptry app/
      - if: matrix.suite == 'unit'
        run: uv run pyright
      - name: Test backend once without external resources
        run: ./scripts/test.sh pr ${{ matrix.paths }} -q

  printer-core:
    name: Printer core quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/packages/printstash-core
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --resolution highest --editable ".[dev,mesh,printers-all,testkit]"
      - run: .venv/bin/pytest tests -q -m "not coverage_gate"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pyright -p pyproject.toml
      - name: Verify generated frontend contract
        run: >-
          .venv/bin/python -m printstash_core.printers.codegen
          --output ../../../frontend/src/generated/printer-contracts.ts --check

  frontend:
    name: Frontend quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # build already runs typecheck, so there is no second typecheck pass.
      - run: pnpm build
      - run: pnpm test

  browser-smoke:
    name: Real-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: uv sync --extra dev --frozen
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify model lifecycle and backup recovery
        working-directory: frontend
        run: pnpm test:e2e:pr
      - name: Upload failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-smoke
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser-extension:
    name: Browser extension quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: browser-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build browser variants and run unit tests
        run: pnpm test
      - name: Verify Chrome Web Store package
        run: pnpm zip:chrome && pnpm test:store

  gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [backend, printer-core, frontend, browser-smoke, browser-extension]
    if: ${{ always() }}
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every quick job to succeed
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
