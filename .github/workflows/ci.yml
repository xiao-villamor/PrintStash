name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Callable from the release workflow so a tag can't publish without these
  # checks passing first (see ghcr.yml).
  workflow_call:
  # Nightly "full-matrix" gate + on-demand run. Every job below already runs
  # per-PR (backend + coverage, storage-s3/MinIO, e2e-real Playwright, frontend
  # mock-API Playwright); these two triggers re-run the whole gauntlet off-peak
  # daily and on manual dispatch, so a comprehensive gate exists without adding
  # new job definitions or slowing individual PRs.
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Lint backend
        run: uv run ruff check app/ tests/

      - name: Test backend
        run: uv run pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=95

  storage-s3:
    name: Storage backend (S3/MinIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      # GitHub Actions `services:` containers can't override CMD, and
      # minio/minio's image needs an explicit `server /data` command to run
      # as a server (its default CMD just prints usage and exits) — so start
      # it by hand instead of as a service container.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -fsS http://localhost:9100/minio/health/live && break
            sleep 1
          done

      - name: Test S3 storage backend + backup destination against real MinIO
        env:
          PRINTSTASH_TEST_S3_ENDPOINT: http://localhost:9100
        run: uv run pytest tests/test_storage_s3.py tests/test_backup_restore.py -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Static analysis (bandit)
        run: uv run bandit -ll -r app/

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --strict

  migration-upgrade:
    name: Migration upgrade (oldest supported release -> head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run upgrade check
        run: ./scripts/test_migration_upgrade.sh

  docker-smoke:
    name: Docker compose smoke (build from source)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and start the light stack
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait --wait-timeout 180 api frontend

      - name: Hit /health
        run: curl -fsS http://localhost:3000/api/v1/health

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm lint

      - name: Unit test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Test frontend in browser
        run: pnpm test:e2e

  e2e-real:
    name: Real-backend E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Backend: the real e2e suite boots uvicorn against a throwaway SQLite DB.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --frozen

      # Frontend: serves a Vite dev server + drives Playwright.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Real-backend E2E
        working-directory: frontend
        run: pnpm test:e2e:real

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Catch arm64 build breakage before it reaches a release tag. Builds both
    # published platforms but never pushes — the release workflows publish.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: printstash-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: printstash-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # Newer binfmt images crash with "illegal instruction" on arm64
          # emulation of Node's JIT output (hung the 0.8.5 release job for
          # 6h before GitHub's job cap force-cancelled it). Pin to the last
          # known-good QEMU build.
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          # ignore-error: a transient GitHub Actions Cache outage (e.g. a 503
          # while exporting) should not fail an otherwise-successful build.
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
