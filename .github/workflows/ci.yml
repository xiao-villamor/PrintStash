name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Callable from the release workflow so a tag can't publish without these
  # checks passing first (see ghcr.yml).
  workflow_call:
  # Nightly "full-matrix" gate + on-demand run. Every job below already runs
  # per-PR (backend + coverage, storage-s3/SeaweedFS, e2e-real Playwright, frontend
  # mock-API Playwright); these two triggers re-run the whole gauntlet off-peak
  # daily and on manual dispatch, so a comprehensive gate exists without adding
  # new job definitions or slowing individual PRs.
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  printer-core:
    name: Printer core (${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        resolution: ["lowest-direct", "highest"]
    defaults:
      run:
        working-directory: backend/packages/printstash-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install autonomous package
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python \
            --resolution ${{ matrix.resolution }} \
            --editable ".[dev,printers-all]"

      - name: Test autonomous package
        run: .venv/bin/pytest tests -q

      - name: Lint autonomous package
        run: .venv/bin/ruff check src tests

      - name: Typecheck autonomous package
        run: .venv/bin/pyright -p pyproject.toml

      - name: Verify generated frontend contract
        if: matrix.python == '3.11' && matrix.resolution == 'highest'
        run: >-
          .venv/bin/python -m printstash_core.printers.codegen
          --output ../../../frontend/src/generated/printer-contracts.ts --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --extra full --frozen

      - name: Verify optional async driver is absent from core
        run: |
          if uv export --no-dev --frozen | grep -q aiosqlite; then
            echo "aiosqlite leaked into the core dependency set"
            exit 1
          fi
          if grep -Eq '^name = "(asyncpg|psycopg2-binary)"' uv.lock; then
            echo "a retired PostgreSQL driver remains in uv.lock"
            exit 1
          fi

      - name: Lint backend
        run: uv run ruff check app/ tests/

      - name: Check dependency declarations
        run: uv run deptry app/

      - name: Typecheck critical backend modules
        run: uv run pyright

      - name: Test backend
        run: uv run pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=95

  backend-python313:
    name: Backend compatibility (Python 3.13, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --extra dev --extra full --frozen

      - name: Run backend compatibility suite
        run: uv run pytest tests -q

  sqlite-async:
    name: SQLite async extra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend with SQLite async capability
        run: uv sync --extra dev --extra async-db --frozen

      - name: Test optional SQLite async contracts
        run: uv run pytest tests/test_db_session.py -v -k "async or capability"

  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printstash
          POSTGRES_PASSWORD: printstash
          POSTGRES_DB: printstash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printstash -d printstash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Test PostgreSQL migrations and critical contracts
        env:
          PRINTSTASH_TEST_POSTGRES_URL: postgresql://printstash:printstash@localhost:5432/printstash
        run: uv run pytest tests/postgres -v

  storage-s3:
    name: Storage backend (S3/SeaweedFS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      # Keep this as an explicit container so the command and development-sized
      # volume allocation match the local integration-test environment.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 9100:8333 \
            -e AWS_ACCESS_KEY_ID=printstash \
            -e AWS_SECRET_ACCESS_KEY=printstash-secret \
            chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d \
            mini -dir=/data -master.volumeSizeLimitMB=64 -master.telemetry=false
          for i in $(seq 1 20); do
            curl -sS http://localhost:9100/ >/dev/null && break
            sleep 1
          done
          curl -sS http://localhost:9100/ >/dev/null

      - name: Test S3 storage backend + backup destination against real SeaweedFS
        env:
          PRINTSTASH_TEST_S3_ENDPOINT: http://localhost:9100
        run: uv run pytest tests/test_storage_s3.py tests/test_backup_restore.py -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Static analysis (bandit)
        run: uv run bandit -ll -r app/

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-local --no-hashes \
            --output-file "${RUNNER_TEMP}/printstash-audit-requirements.txt"
          uv run --no-sync pip-audit --strict \
            --requirement "${RUNNER_TEMP}/printstash-audit-requirements.txt"

  migration-upgrade:
    name: Migration upgrade (oldest supported release -> head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run upgrade check
        run: ./scripts/test_migration_upgrade.sh

  docker-smoke:
    name: Docker full/lite smoke and size gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build full API, lite API, and frontend
        run: |
          docker build --build-arg PRINTSTASH_VARIANT=full -t ghcr.io/xiao-villamor/printstash-api:latest backend
          docker build --build-arg PRINTSTASH_VARIANT=lite -t printstash-api-lite-ci backend
          docker build -t ghcr.io/xiao-villamor/printstash-frontend:latest frontend

      - name: Verify image capabilities, size, and startup
        run: ./scripts/check_api_image_variants.sh ghcr.io/xiao-villamor/printstash-api:latest printstash-api-lite-ci

      - name: Start composed full stack
        run: docker compose -f docker-compose.yml up -d --no-build --wait --wait-timeout 180 api frontend

      - name: Hit /health
        run: >-
          curl --fail --show-error --silent
          --retry 5 --retry-delay 1 --retry-all-errors
          http://localhost:3000/api/v1/health

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml down -v

  minio-migration:
    name: MinIO to SeaweedFS migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify idempotent migration and downloaded content
        run: ./scripts/test_minio_migration.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm lint

      - name: Unit test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Test frontend in browser
        run: pnpm test:e2e

  e2e-real:
    name: Real-backend E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Backend: the real e2e suite boots uvicorn against a throwaway SQLite DB.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --frozen

      # Frontend: serves a Vite dev server + drives Playwright.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Real-backend E2E
        working-directory: frontend
        run: pnpm test:e2e:real

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Catch arm64 build breakage before it reaches a release tag. Builds both
    # published platforms but never pushes — the release workflows publish.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: printstash-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=full
          - image: printstash-api-lite
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: PRINTSTASH_VARIANT=lite
          - image: printstash-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # Newer binfmt images crash with "illegal instruction" on arm64
          # emulation of Node's JIT output (hung the 0.8.5 release job for
          # 6h before GitHub's job cap force-cancelled it). Pin to the last
          # known-good QEMU build.
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # ignore-error: a transient GitHub Actions Cache outage (e.g. a 503
          # while exporting) should not fail an otherwise-successful build.
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true

  arm-step-runtime:
    name: ARM64 STEP runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build loadable ARM64 full image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          load: true
          tags: printstash-arm-step-smoke:ci
          build-args: PRINTSTASH_VARIANT=full
          cache-from: type=gha,scope=printstash-api

      - name: Tessellate a valid STEP fixture in ARM64 userspace
        run: >-
          docker run --rm --platform linux/arm64
          -v "$PWD/backend/tests/fixtures:/fixtures:ro"
          printstash-arm-step-smoke:ci
          /app/.venv/bin/python -c
          "from pathlib import Path; from app.services.mesh_processing import _load_mesh; mesh = _load_mesh(Path('/fixtures/cascadio_material.stp')); assert mesh is not None and len(mesh.faces) > 0"
